name: package-and-focused-tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and focused dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Compile Python sources
        run: python -m compileall -q weqmmm scripts tests
      - name: Run provider-independent tests
        run: python -m pytest -q tests/test_link_projection.py tests/test_distances_reporter.py
